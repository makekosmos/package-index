name: Publish Package catalog

on:
  workflow_dispatch:
    inputs:
      bom_ref:
        description: Immutable 40-character Package Index commit SHA containing the BOM
        required: true
        type: string
      bom_path:
        description: Path to the checked-in v1 BOM at bom_ref
        required: true
        default: release/bom.v1.json
        type: string
      sequence:
        description: BOM catalog sequence and next strictly increasing catalog sequence
        required: true
        type: string
      issued_at:
        description: Catalog issued-at ISO UTC timestamp
        required: true
        type: string
      expires_at:
        description: Catalog expiry ISO UTC timestamp (at most 366 days later)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    environment: production
    runs-on: windows-latest
    permissions: { contents: read }
    steps:
      - name: Check out the reviewed BOM and catalog tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.bom_ref }}
          persist-credentials: false

      - name: Resolve Cortex from the reviewed BOM
        id: bom
        env:
          BOM_PATH: ${{ inputs.bom_path }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -f "$BOM_PATH" ]]
          cortex_ref=$(node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));process.stdout.write(bom.source.cortex.commit)')
          [[ "$cortex_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "cortex_ref=$cortex_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Cortex source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: makekosmos/cortex
          ref: ${{ steps.bom.outputs.cortex_ref }}
          token: ${{ secrets.KOSMOS_SOURCE_REPO_TOKEN }}
          persist-credentials: false
          path: cortex

      - name: Build and sign the replacement catalog
        env:
          GH_TOKEN: ${{ secrets.KOSMOS_RELEASE_REPO_TOKEN }}
          KOSMOS_SOURCE_REPO_TOKEN: ${{ secrets.KOSMOS_SOURCE_REPO_TOKEN }}
          KOSMOS_PACKAGE_RELEASE_PRIVATE_KEY: ${{ secrets.KOSMOS_PACKAGE_RELEASE_PRIVATE_KEY }}
          SOURCE_REF: ${{ steps.bom.outputs.cortex_ref }}
          BOM_REF: ${{ inputs.bom_ref }}
          BOM_PATH: ${{ inputs.bom_path }}
          CATALOG_SEQUENCE: ${{ inputs.sequence }}
          CATALOG_ISSUED_AT: ${{ inputs.issued_at }}
          CATALOG_EXPIRES_AT: ${{ inputs.expires_at }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$BOM_REF" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$BOM_REF" ]]
          [[ "$(git -C cortex rev-parse HEAD)" == "$SOURCE_REF" ]]
          [[ -f "$BOM_PATH" ]]
          mkdir -p out/previous
          previous_sequence=$((CATALOG_SEQUENCE - 1))
          [[ "$previous_sequence" =~ ^[1-9][0-9]*$ ]]
          gh release download "catalog-$previous_sequence" --repo makekosmos/package-index --pattern catalog.json --dir out/previous
          node scripts/validate-bom.mjs --bom "$BOM_PATH" --sequence "$CATALOG_SEQUENCE" --allow-pending-builds --print-downloads > out/bom-downloads.tsv
          node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));for(const source of Object.values(bom.source).filter((value)=>value?.repository&&value?.commit))console.log(`${source.repository}\t${source.commit}`)' > out/bom-sources.tsv
          [[ -n "${KOSMOS_SOURCE_REPO_TOKEN:-}" ]]
          while IFS=$'\t' read -r repository commit; do
            [[ "$(GH_TOKEN="$KOSMOS_SOURCE_REPO_TOKEN" gh api "repos/$repository/commits/$commit" --jq .sha)" == "$commit" ]]
          done < out/bom-sources.tsv
          CORE_REF=$(node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));process.stdout.write(bom.source.core.commit)')
          grep -F "rev = \"$CORE_REF\"" cortex/runtime/Cargo.toml
          grep -F "core.git?rev=$CORE_REF#$CORE_REF" cortex/Cargo.lock
          STORE_REPOSITORY=$(node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));process.stdout.write(bom.source.store.repository)')
          STORE_REF=$(node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));process.stdout.write(bom.source.store.commit)')
          GH_TOKEN="$KOSMOS_SOURCE_REPO_TOKEN" gh api -H "Accept: application/vnd.github.raw+json" "repos/$STORE_REPOSITORY/contents/catalog.json?ref=$STORE_REF" > out/store-catalog.json
          STORE_CATALOG="$GITHUB_WORKSPACE/out/store-catalog.json" node -e 'const fs=require("node:fs"),bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8")),store=JSON.parse(fs.readFileSync(process.env.STORE_CATALOG,"utf8"));if(store.sequence!==bom.catalog.store_sequence)throw new Error("Store sequence does not match pinned Store commit")'
          while IFS=$'\t' read -r repository release_tag ref archive; do
            [[ -n "$repository" && -n "$release_tag" && -n "$ref" && -n "$archive" ]]
            [[ "$(GH_TOKEN="$KOSMOS_SOURCE_REPO_TOKEN" gh api "repos/$repository/commits/$release_tag" --jq .sha)" == "$ref" ]]
            GH_TOKEN="$KOSMOS_SOURCE_REPO_TOKEN" gh release download "$release_tag" --repo "$repository" --pattern "$archive" --dir out
          done < out/bom-downloads.tsv
          node scripts/validate-bom.mjs --bom "$BOM_PATH" --sequence "$CATALOG_SEQUENCE" --allow-pending-builds --verify-artifacts --artifacts-dir out
          node --input-type=module -e 'const fs=require("node:fs");const bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8"));if(bom.source.cortex.commit!==process.env.SOURCE_REF)throw new Error("source_ref does not match BOM Cortex commit");'
          node scripts/build-source-packages.mjs --bom "$BOM_PATH" --cortex cortex --out out --sequence "$CATALOG_SEQUENCE"
          export BOM_RESOLVED="$GITHUB_WORKSPACE/out/release-bom.v1.json" CATALOG="$GITHUB_WORKSPACE/out/catalog.json" CATALOG_INPUT="$GITHUB_WORKSPACE/out/catalog.input.json" SIGNATURES="$GITHUB_WORKSPACE/out/catalog.signatures.json" ENVELOPE="$GITHUB_WORKSPACE/out/catalog.envelope.json"
          node --input-type=module - <<'NODE'
          const crypto=await import("node:crypto"),fs=await import("node:fs"),path=await import("node:path"),{pathToFileURL}=await import("node:url"),out=path.join(process.env.GITHUB_WORKSPACE,"out"),{readZip}=await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE,"cortex/desktop/scripts/zip-utils.mjs")).href);
          const bom=JSON.parse(fs.readFileSync(process.env.BOM_PATH,"utf8")),sourceCatalog=JSON.parse(fs.readFileSync(path.join(out,"source-packages.json"))),sourceIds=new Set(bom.packages.filter((entry)=>entry.kind==="source").map((entry)=>entry.id));
          if(sourceCatalog.bom_id!==bom.id||sourceCatalog.packages.length!==sourceIds.size||sourceCatalog.packages.some((entry)=>!sourceIds.has(entry.manifest?.id)))throw new Error("source package catalog does not match BOM");
          const packageFrom=(spec)=>{const archivePath=path.join(out,spec.artifact.name),bytes=fs.readFileSync(archivePath),manifest=JSON.parse(readZip(archivePath).find((entry)=>entry.name==="manifest.json"&&!entry.isDir).data.toString("utf8"));if(manifest.schema_version!==2||manifest.id!==spec.manifest_id||manifest.version!==spec.version||manifest.kind!==spec.kind||manifest.engine_api!==spec.engine_api||manifest.entrypoint!==spec.entrypoint||manifest.icon!==spec.icon)throw new Error(`invalid manifest for ${spec.id}`);const sha256=crypto.createHash("sha256").update(bytes).digest("hex"),size=bytes.length;return {spec,manifest,sha256,size,artifact:{name:spec.artifact.name,url:`https://github.com/makekosmos/package-index/releases/download/catalog-${process.env.CATALOG_SEQUENCE}/${spec.artifact.name}`,sha256,size}};};
          const resolved=bom.packages.map(packageFrom),packages=resolved.map((entry)=>({manifest:entry.manifest,archive_url:entry.artifact.url,sha256:entry.sha256,size:entry.size}));
          fs.writeFileSync(process.env.BOM_RESOLVED,JSON.stringify({...bom,state:"resolved",packages:resolved.map((entry)=>({...entry.spec,artifact:entry.artifact}))},null,2)+"\n");
          const prior=JSON.parse(fs.readFileSync(path.join(out,"previous","catalog.json"))),sequence=Number(process.env.CATALOG_SEQUENCE),replaced=new Set([...bom.retired_package_ids,...bom.packages.map((entry)=>entry.manifest_id)]);if(!Number.isInteger(sequence)||sequence<=1||!Number.isFinite(Date.parse(process.env.CATALOG_ISSUED_AT))||!Number.isFinite(Date.parse(process.env.CATALOG_EXPIRES_AT))||Date.parse(process.env.CATALOG_EXPIRES_AT)<=Date.parse(process.env.CATALOG_ISSUED_AT)||Date.parse(process.env.CATALOG_EXPIRES_AT)-Date.parse(process.env.CATALOG_ISSUED_AT)>366*86400000)throw new Error("invalid catalog metadata");if(prior.sequence!==sequence-1)throw new Error("prior catalog sequence mismatch");
          fs.writeFileSync(process.env.CATALOG_INPUT,JSON.stringify({schema_version:1,sequence,issued_at:process.env.CATALOG_ISSUED_AT,expires_at:process.env.CATALOG_EXPIRES_AT,packages:[...prior.packages.filter((entry)=>!replaced.has(entry.manifest.id)),...packages]},null,2));
          NODE
          node scripts/validate-bom.mjs --bom "$BOM_RESOLVED" --sequence "$CATALOG_SEQUENCE" --verify-artifacts --artifacts-dir out
          [[ -n "${KOSMOS_PACKAGE_RELEASE_PRIVATE_KEY:-}" ]]
          BOM_SIGNING_KEY_ID=$(node --input-type=module -e 'const fs=require("node:fs");console.log(JSON.parse(fs.readFileSync(process.env.BOM_RESOLVED,"utf8")).catalog.signing_key_id)')
          KEY_PATH="$RUNNER_TEMP/kosmos-release-private.pem"; trap 'rm -f -- "$KEY_PATH"' EXIT
          KEY_PATH="$KEY_PATH" node -e 'const fs=require("node:fs");fs.writeFileSync(process.env.KEY_PATH,process.env.KOSMOS_PACKAGE_RELEASE_PRIVATE_KEY,{mode:0o600})'
          unset KOSMOS_PACKAGE_RELEASE_PRIVATE_KEY
          node cortex/desktop/scripts/package-catalog.mjs --input "$CATALOG_INPUT" --output "$CATALOG"
          rm -f "$CATALOG_INPUT" out/bom-downloads.tsv out/bom-sources.tsv out/store-catalog.json
          node cortex/desktop/scripts/package-sign.mjs --input "$CATALOG" --output "$SIGNATURES" --signer "$BOM_SIGNING_KEY_ID=$KEY_PATH"
          node cortex/desktop/scripts/package-envelope.mjs --catalog "$CATALOG" --signatures "$SIGNATURES" --output "$ENVELOPE"
          gh release view "catalog-$CATALOG_SEQUENCE" --repo makekosmos/package-index >/dev/null 2>&1 && exit 1 || true
          gh release create "catalog-$CATALOG_SEQUENCE" "$CATALOG" "$ENVELOPE" "$SIGNATURES" "$BOM_RESOLVED" out/*.kspkg --repo makekosmos/package-index --target "$BOM_REF" --title "Package catalog $CATALOG_SEQUENCE" --notes "Immutable catalog and release BOM from Cortex $SOURCE_REF."
